services:
  - type: web
    name: alkafolio-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production

      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      - key: COINGECKO_API_KEY
        sync: false
