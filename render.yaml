services:
  - type: web
    name: alkafolio-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # --- Required secrets (set manually in Render dashboard) ---
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Email OTP (optional — OTP is returned in response if unset) ---
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      # --- CoinGecko (optional — free tier works without a key) ---
      - key: COINGECKO_API_KEY
        sync: false
